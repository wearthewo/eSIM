{# The product mark: inline SVG (no <img>: admin pages are checked to contain none), coloured by app.css. -#}
{% macro brand_mark() %}<svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path class="sim" d="M9 2h11.2L27 8.8V27a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3V5a3 3 0 0 1 3-3z"/><rect class="chip" x="10.5" y="13" width="11" height="11" rx="2"/><path class="chip-lines" d="M16 13v11M10.5 18.5h11M13.5 13v3.5M18.5 21v3"/></svg>{% endmacro -%}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  {# htmx: no injected <style> (CSP), no eval, no scripts from responses, no history
     snapshots in localStorage, and swap 4xx/5xx responses so error messages show. #}
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false, "historyEnabled": false, "historyCacheSize": 0, "responseHandling": [{"code": "204", "swap": false}, {"code": "...", "swap": true}]}'>
  <title>{% block title %}eSIM PDF generator{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/static/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
{# Logged in: every htmx request carries the session's CSRF token as a header. #}
<body{% if csrf_token %} hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'{% endif %}>
  <a class="skip-link" href="#main">Skip to content</a>
  {% if current_user %}
  {% set path = request.url.path %}
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">{{ brand_mark() }}eSIM PDF generator</a>
      <nav class="site-nav" aria-label="Main">
        {% if current_user.organization_id %}<a class="nav-link"{% if path == "/" %} aria-current="page"{% endif %} href="/">Upload</a>{% endif %}
        <a class="nav-link"{% if path.startswith("/history") %} aria-current="page"{% endif %} href="/history">History</a>
        {% if current_user.role == "owner" and current_user.organization_id %}<a class="nav-link"{% if path.startswith("/team") %} aria-current="page"{% endif %} href="/team">Team</a>{% endif %}
        {% if current_user.is_superadmin %}
        <a class="nav-link"{% if path.startswith("/admin/orgs") %} aria-current="page"{% endif %} href="/admin/orgs">Admin</a>
        <a class="nav-link{% if pending_requests %} has-pending{% endif %}"{% if path.startswith("/admin/requests") %} aria-current="page"{% endif %} href="/admin/requests">Requests ({{ pending_requests }})</a>
        {% endif %}
        <a class="nav-link"{% if path.startswith("/account/2fa") %} aria-current="page"{% endif %} href="/account/2fa">Two-factor</a>
      </nav>
      <div class="account">
        <span class="who" title="{{ current_user.email }}">{{ current_user.email }}</span>
        <form method="post" action="/logout" class="logout">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button type="submit" class="btn btn-ghost btn-sm">Log out</button>
        </form>
      </div>
    </div>
  </header>
  <main id="main" class="container">
  {% else %}
  {# Logged out: a centred card under the product name. #}
  <main id="main" class="auth-shell">
    <div class="auth-brand">
      <a class="brand" href="/login">{{ brand_mark() }}eSIM PDF generator</a>
      <p class="tagline">Turn eSIM activation codes into ready-to-send PDFs</p>
    </div>
  {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
