<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {# htmx: no injected <style> (CSP), no eval, no scripts from responses, no history
     snapshots in localStorage, and swap 4xx/5xx responses so error messages show. #}
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false, "historyEnabled": false, "historyCacheSize": 0, "responseHandling": [{"code": "204", "swap": false}, {"code": "...", "swap": true}]}'>
  <title>{% block title %}eSIM PDF generator{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
{# Logged in: every htmx request carries the session's CSRF token as a header. #}
<body{% if csrf_token %} hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'{% endif %}>
  {% if current_user %}
  <header class="site-header">
    <span class="who">{{ current_user.email }}</span>
    <form method="post" action="/logout" class="logout">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit">Log out</button>
    </form>
  </header>
  {% endif %}
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
