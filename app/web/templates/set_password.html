{% extends "base.html" %}
{% block title %}Set your password · eSIM PDF generator{% endblock %}
{% block content %}
<h1>{% if is_invite %}Welcome: set your password{% else %}Set a new password{% endif %}</h1>
<p>Account: <strong>{{ email }}</strong></p>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/invite/{{ token }}" class="auth-form">
  <input type="hidden" name="form_token" value="{{ form_token }}">
  <label for="password">New password ({{ min_chars }} to {{ max_chars }} characters)</label>
  <input id="password" type="password" name="password" required autocomplete="new-password"
         minlength="{{ min_chars }}" maxlength="{{ max_chars }}">
  <label for="password_confirm">Repeat the password</label>
  <input id="password_confirm" type="password" name="password_confirm" required autocomplete="new-password"
         minlength="{{ min_chars }}" maxlength="{{ max_chars }}">
  <p><button type="submit">Set password and log in</button></p>
</form>
{% endblock %}
