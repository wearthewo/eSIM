{% extends "base.html" %}
{% block title %}Log in · eSIM PDF generator{% endblock %}
{% block content %}
<h1>Log in</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login" class="auth-form">
  <input type="hidden" name="form_token" value="{{ form_token }}">
  <label for="email">Email</label>
  <input id="email" type="email" name="email" required autocomplete="username" maxlength="254">
  <label for="password">Password</label>
  <input id="password" type="password" name="password" required autocomplete="current-password" maxlength="128">
  <p><button type="submit">Log in</button></p>
</form>
<p>Accounts are by invitation only. Forgot your password? Ask your administrator for a reset link.</p>
{% endblock %}
