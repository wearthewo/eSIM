[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "esim"
version = "0.1.0"
description = "Upload eSIM activation codes, get a ZIP of branded QR-code PDFs."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    # Pinned to the minor version: app/core/qr.py make_qr_matrix reproduces segno's
    # mask selection and is parity-tested against it (tests/core/test_qr.py).
    "segno>=1.6,<1.7",
    # Pinned to the minor version: app/core/render.py relies on ReportLab internals
    # (mirrors TTFont.addObjects, registers prepared image XObjects via canvas._doc,
    # sets rl_config.useA85). Re-check render.py and its tests before bumping.
    "reportlab>=5.1,<5.2",
    "openpyxl",
    "defusedxml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.core" = ["assets/fonts/*"]
"app.web" = ["templates/*.html", "static/*", "static/brand/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/web/static"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
