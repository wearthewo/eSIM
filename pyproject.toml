[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "esim"
version = "0.1.0"
description = "Upload eSIM activation codes, get a ZIP of branded QR-code PDFs."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    # Pinned to the minor version: app/core/qr.py make_qr_matrix reproduces segno's
    # mask selection and is parity-tested against it (tests/core/test_qr.py).
    "segno>=1.6,<1.7",
    # Pinned to the minor version: app/core/render.py relies on ReportLab internals
    # (registers prepared image XObjects via canvas._doc, sets rl_config.useA85).
    # Re-check render.py and its tests before bumping. render.py also imports Pillow,
    # which ReportLab depends on.
    "reportlab>=5.1,<5.2",
    # Pinned to the minor version: app/core/sheets.py overrides
    # ExcelWriter.write_worksheet so worksheets are serialised in memory, not via
    # a temporary file. Re-check sheets.py and its tests before bumping.
    "openpyxl>=3.1,<3.2",
    "defusedxml",
    # Phase 2: database (metadata only, see CLAUDE.md), migrations, password hashing.
    "sqlalchemy>=2.1,<2.2",
    "alembic>=1.20,<1.21",
    "psycopg[binary]>=3.3,<3.4",
    "argon2-cffi>=25.1,<25.2",
    "python-dotenv>=1.2,<1.3",
    # Two-factor authentication: AES-256-GCM for the stored TOTP secrets, HKDF for the
    # subkeys of MFA_KEY (app/auth/mfa.py). TOTP itself is stdlib hmac.
    "cryptography>=50,<51",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx", "playwright"]  # playwright: screens.py, tests/e2e

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.core" = ["assets/fonts/*"]
"app.web" = ["templates/*.html", "static/*", "static/brand/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The browser journey (tests/e2e) is left out of the default run: pytest -m e2e
addopts = "-m 'not e2e'"
markers = ["e2e: end-to-end browser journey (Playwright); run with pytest -m e2e"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/web/static"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts; hard-coded synthetic test secrets
